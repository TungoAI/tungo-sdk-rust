name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format, clippy, docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Version consistency
        run: bash scripts/release-version.sh check "$(grep -m 1 -oE '[0-9]+\.[0-9]+\.[0-9]+' Cargo.toml)"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features --features native-tls -- -D warnings
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  test:
    name: Test (Rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported Rust version (rust-version in Cargo.toml) and the latest stable.
        toolchain: ["1.86", stable]
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          rustup toolchain install "${TOOLCHAIN}" --profile minimal
          rustup default "${TOOLCHAIN}"
      - name: Tests, doc tests and examples
        run: cargo test --all-features
      - name: Run the offline example
        run: cargo run --all-features --example money

  package:
    name: Package and build a consumer project
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Package the crate
        run: cargo package
      - name: Build the README quick start against the packaged crate
        run: bash scripts/consumer-check.sh
