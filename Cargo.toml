# Generated by tungo-sdkgen. Do not edit.
[package]
name = "tungo-sdk"
version = "0.2.0" # x-release-version
edition = "2021"
rust-version = "1.86"
# The MSRV-aware resolver: with no Cargo.lock in the repository, builds on the
# minimum supported Rust pick dependency versions that still support it.
resolver = "3"
description = "Official Rust SDK for the Tungo Platform API"
license = "MIT"
repository = "https://github.com/TungoAI/tungo-sdk-rust"
homepage = "https://tungo.kz"
documentation = "https://docs.rs/tungo-sdk"
readme = "README.md"
keywords = ["tungo", "api", "sdk", "accounting", "kazakhstan"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
include = [
    "/src",
    "/tests",
    "/examples",
    "/conformance",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["rustls-tls"]
# TLS through rustls.
rustls-tls = ["reqwest/rustls"]
# TLS through the platform's native library.
native-tls = ["reqwest/native-tls"]
# Conversions between rust_decimal::Decimal and tiyn.
rust_decimal = ["dep:rust_decimal"]

[dependencies]
base64 = "0.22"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
hmac = "0.12"
httpdate = "1"
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["http2", "system-proxy"] }
rust_decimal = { version = "1.36", optional = true, default-features = false, features = ["std"] }
serde = { version = "1.0.185", features = ["derive"] }
serde_json = "1.0.100"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.38", features = ["time"] }
uuid = { version = "1.8", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1.38", features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }
